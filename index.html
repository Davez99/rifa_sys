<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="utf-8" />
    <title>Rifa</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link href="src/Assets/css/rifaLoad.css" rel="stylesheet" />
    <style></style>
  </head>
  <body class="container py-4">
    <div class="pb-3 mb-4 border-bottom">
      <h2 id="nomeRifa">Nome da Rifa</h2>
      <p><strong>Organizador:</strong> <span id="organizador"></span></p>
      <p><strong>WhatsApp:</strong> <span id="whatsapp"></span></p>
      <p><strong>Valor por número:</strong> R$ <span id="valor"></span></p>
    </div>

    <hr />
    <div class="numeros-container" id="numerosContainer"></div>

    <!-- Modal confirmação de número -->
    <div id="modalSelecao" class="modal-dialog draggable" style="display: none">
      <div class="modal modal-dialog-centered">
        <div class="modal-content">
          <div id="modalHeader" class="modal-header bg-primary text-white">
            <h5 class="modal-title">Números Selecionados</h5>
            <button
              type="button"
              class="btn-close"
              onclick="fecharModal()"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-body">
            <p><strong>Números selecionados:</strong></p>
            <div id="numerosSelecionados" class="mb-3"></div>
            <div class="mt-3">
              <p><strong>Total Selecionado:</strong> R$ <span id="totalSelecionado">0.00</span></p>
            </div>
            <input
              type="text"
              id="comprador"
              class="form-control mb-3"
              placeholder="Seu nome completo"
            />
          </div>
          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-secondary"
              onclick="fecharModal()"
            >
              Cancelar
            </button>
            <button
              type="button"
              class="btn btn-success"
              onclick="confirmarReserva()"
            >
              Confirmar Reserva
            </button>
          </div>
        </div>
      </div>
    </div>

    <script src="src/Assets/scripts/rifaLoad.js"></script>
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
